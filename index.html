<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胶卷索引打印工具</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171310'/%3E%3Crect x='6' y='6' width='20' height='20' rx='2' fill='%23100d0a'/%3E%3Ccircle cx='16' cy='14' r='5' fill='%23e0a458'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#12100e;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
    color:#e8e4dd;padding:20px;
  }
  .box{
    width:100%;max-width:340px;background:#1b1815;
    border:1px solid rgba(224,164,88,.22);border-radius:16px;
    padding:32px 28px;text-align:center;
  }
  .icon{
    width:52px;height:52px;margin:0 auto 18px;border-radius:12px;
    background:#100d0a;border:1px solid rgba(224,164,88,.3);
    display:flex;align-items:center;justify-content:center;
  }
  h1{font-size:17px;font-weight:500;margin-bottom:6px;letter-spacing:.02em}
  .sub{font-size:12.5px;color:#8b837a;margin-bottom:22px;line-height:1.6}
  input{
    width:100%;padding:13px 14px;font-size:22px;text-align:center;
    letter-spacing:.42em;text-indent:.42em;
    background:#100d0a;border:1px solid rgba(224,164,88,.28);
    border-radius:10px;color:#e0a458;outline:none;
    font-family:inherit;
  }
  input:focus{border-color:rgba(224,164,88,.6)}
  input::placeholder{color:#5a534b;letter-spacing:.2em;text-indent:.2em}
  button{
    width:100%;margin-top:14px;padding:13px;font-size:14.5px;font-weight:500;
    background:#e0a458;border:none;border-radius:10px;color:#17130f;
    cursor:pointer;font-family:inherit;
  }
  button:active{opacity:.85}
  .msg{
    min-height:18px;margin-top:14px;font-size:13px;
    color:#e07a5f;opacity:0;transition:opacity .18s;
  }
  .msg.show{opacity:1}
  .hint{margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);
    font-size:11.5px;color:#5f594f;line-height:1.7;text-align:left}
  .hint b{color:#8b837a;font-weight:500}
</style>
</head>
<body>
<div class="box">
  <div class="icon">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e0a458" stroke-width="1.6">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M8 5l1.5-2h5L16 5"/>
    </svg>
  </div>
  <h1>胶卷索引打印工具</h1>
  <p class="sub">请输入访问密码</p>

  <input id="pw" type="password" inputmode="numeric" pattern="[0-9]*"
         maxlength="6" placeholder="4-6 位数字" autocomplete="off"
         autocapitalize="off" spellcheck="false">
  <button id="go">进 入</button>
  <div class="msg" id="msg"></div>

  <div class="hint">
    <b>使用提示</b><br>
    · 照片全程在本机浏览器处理，不会上传<br>
    · 导出设置：A4 横向 / 边距 6mm / 每行 6 张<br>
    · 打印时缩放选 100%，勾选「背景图形」
  </div>
</div>

<script>
(function () {
  var input = document.getElementById('pw');
  var btn = document.getElementById('go');
  var msg = document.getElementById('msg');
  var PASSWORD = '24680';         // 访问密码
  var TOOL = 'tool.html';         // 工具页面（扁平结构，同级）
  var KEY = 'filmidx_ok';// 验证通过标记

  function fail() {
    msg.textContent = '密码不正确';
    msg.classList.add('show');
    input.value = '';
    input.focus();
  }

  function enter() {
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    location.replace(TOOL);
  }

  function go() {
    var pw = input.value.trim();
    if (!pw) return;
    if (!/^[0-9]{4,6}$/.test(pw)) {
      msg.textContent = '请输入 4-6 位数字密码';
      msg.classList.add('show');
      return;
    }
    // 硬编码比对密码，不靠"目录是否存在"判断 ——
    // 部署到服务器后目录结构公开，靠探测等于明文暴露密码。
    if (pw !== PASSWORD) { fail(); return; }
    enter();
  }

  btn.addEventListener('click', go);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') go();
  });

  // 从 /pw-24680/ 被守卫弹回来时，给个提示
  if (/[?&]guard=1/.test(location.search)) {
    msg.textContent = '请先输入访问密码';
    msg.classList.add('show');
  }
  input.focus();
})();
</script>
</body>
</html>
